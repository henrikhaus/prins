:root { --ink: #1c1a17; --ink-soft: rgba(28,20,15,.82); --bg: #b67e60; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: Archivo, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  outline: none; opacity: 0; transition: opacity .5s ease; }
.ready #stage { opacity: 1; }
.chrome { transition: opacity .25s ease; position: fixed; pointer-events: none; left: max(32px, env(safe-area-inset-left)); right: max(32px, env(safe-area-inset-right)); }
.head { top: max(26px, env(safe-area-inset-top)); }
.foot { bottom: max(24px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: baseline; gap: 24px; }
h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -.025em; }
.pitch { margin: 6px 0 0; font-size: 18px; line-height: 1.3; font-weight: 500; letter-spacing: -.008em; max-width: 34em; }
.hint, .cap { margin: 0; font-size: 14px; line-height: 1.35; color: var(--ink-soft); font-weight: 500; }
.cap { white-space: nowrap; }
.zoomed .chrome { opacity: 0; }
.sr { position: fixed; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; margin: 0; opacity: 0; overflow: hidden; }
.sr:focus-visible { opacity: 1; width: auto; height: auto; left: 32px; top: 104px; padding: 8px 12px; overflow: visible; background: #1c1a17; color: #fff; border-radius: 8px; font: 500 14px Archivo, Helvetica, Arial, sans-serif; outline: 2px solid #fff; outline-offset: 2px; }
.narrow { display: none; }
.nogl { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; }
.nogl img { max-width: 100%; max-height: 100%; object-fit: contain; }
.no-webgl #stage { display: none; }
.no-webgl .nogl { display: flex; }
@media (max-width: 640px) {
  .chrome { left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); }
  .head { top: max(16px, env(safe-area-inset-top)); }
  .foot { bottom: max(14px, env(safe-area-inset-bottom)); flex-direction: column; gap: 4px; align-items: flex-start; }
  .wide { display: none; }
  .narrow { display: inline; }
  .sr:focus-visible { left: 16px; top: 96px; }
  h1 { font-size: 25px; }
  .pitch { font-size: 16px; margin-top: 4px; }
  .hint, .cap { font-size: 13px; }
}
@media (max-height: 500px) and (min-width: 641px) {
  .head { top: 16px; }
  h1 { font-size: 24px; }
  .pitch { font-size: 15px; max-width: 15em; }
  .foot { bottom: 12px; }
  .hint, .cap { font-size: 12px; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="Interactive 3D model of the Prins desk device. Drag to turn it. The three keys on the device work."></canvas>
<header class="chrome head">
  <h1>Prins</h1>
  <p class="pitch">200 messages hit your inbox. Five sticky notes reach your desk.</p>
</header>
<footer class="chrome foot">
  <p class="hint"><span class="wide">Drag to turn. Press the keys: green prints, red dismisses, hold blue to talk.</span><span class="narrow">Drag to turn. Tap the keys, hold blue to talk.</span></p>
  <p class="cap">Concept design</p>
</footer>
<button class="sr" data-key="blue" type="button">Blue key: hold to talk</button>
<button class="sr" data-key="green" type="button">Green key: print this note</button>
<button class="sr" data-key="red" type="button">Red key: dismiss</button>
