[project]
name = "prins"
version = "0.1.0"
description = "A desk device that turns your inbox and your voice into sticky notes you approve with a button."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "atech>=1.0.0a12",
    "pillow>=10.1",
    "pyserial>=3.5",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.18"]
dev = ["pytest>=8"]

[project.scripts]
prins = "prins.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
